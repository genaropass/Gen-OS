[package]
name = "agentos-kernel"
version = "0.1.0"
edition = "2021"
description = "Microkernel Bare-Metal de AgentOS para x86-64"

[[bin]]
name = "agentos-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
causal-core = { path = "../crates/causal-core", default-features = false }
capability-engine = { path = "../crates/capability-engine", default-features = false }

[features]
default = []
test-exit = []
