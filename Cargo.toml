[workspace]
members = [
    "crates/causal-core",
    "crates/capability-engine",
    "crates/agent-runtime",
    "crates/semantic-fs",
    "kernel",
    "xtask",
]
default-members = [
    "crates/causal-core",
    "crates/capability-engine",
    "crates/agent-runtime",
    "crates/semantic-fs",
    "xtask",
]
resolver = "2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
